name: Deploy .NET to FTP on main push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./AM-Hub/AM-Hub.csproj

      - name: Publish
        run: |
          set -euo pipefail
          dotnet publish ./AM-Hub/AM-Hub.csproj -c Release -o ./publish
          echo "Published entry assemblies:"
          ls -1 ./publish/*.dll
          test -f ./publish/AM-Hub.dll
          test -f ./publish/AM-Hub.runtimeconfig.json
          grep -F '"version": "8.0' ./publish/AM-Hub.runtimeconfig.json

      - name: Write deploy info
        run: |
          set -euo pipefail
          echo "${{ github.sha }}" > ./publish/deploy-info.txt
          expected="$(tr -d '[:space:]' < ./AM-Hub/dllpointer)"
          if [ ! -f "./publish/${expected}" ]; then
            echo "dllpointer says '${expected}' but that file is not in publish/:" >&2
            ls -1 ./publish/*.dll >&2
            exit 1
          fi
          cp ./AM-Hub/dllpointer ./publish/dllpointer
          printf '%s\n' "${expected}" > ./publish/dllpointer
          echo "dllpointer -> ${expected}"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy publish/ to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete \
          --exclude "^equipment-models\.json$" \
          --exclude "^appsettings\.Local\.json$" \
          --exclude "^data(/.*)?$" \
          ./publish .

          bye
          EOF
